$schema: https://api.gitbook.com/gitbook-docs.yaml
# GitBook Site Git Sync 설정
# 위치: task-guide/gitbook-docs.yaml  (GitBook의 Project directory = task-guide)
# 경로 기준: content.directory 는 Project directory(task-guide) 기준 상대 경로입니다.
# 랜딩 페이지와 사이드바 목록은 이 파일이 아니라 ko/README.md, ko/SUMMARY.md 가 결정합니다.

site:
  title: NHN Cloud Task Guide
  structure:
    - type: space
      key: space-task-guide-ko   # 동기화 이후에는 절대 바꾸지 않습니다 (바꾸면 새 스페이스가 생성됨)
      title: Task Guide
      path: task-guide
      default: true
      content:
        directory: ./ko
        language: ko

    # 번역본이 생기면 아래 주석을 풀어 언어별 스페이스를 추가합니다.
    # key 는 파일 전체에서 유일해야 하고, default: true 는 정확히 하나만 둡니다.
    #
    # - type: space
    #   key: space-task-guide-en
    #   title: Task Guide
    #   path: task-guide-en
    #   content:
    #     directory: ./en
    #     language: en
