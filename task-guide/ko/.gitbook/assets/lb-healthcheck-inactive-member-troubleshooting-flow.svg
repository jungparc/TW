<svg viewBox="0 0 950 1420" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR, NanumSquare, sans-serif">

  <!-- Background -->
  <rect x="0" y="0" width="950" height="1420" fill="#FCFCFC"/>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#003087">로드밸런서 멤버 INACTIVE 상태 진단 플로우차트</text>

  <!-- ===================== Start Box ===================== -->
  <rect x="270" y="50" width="260" height="60" rx="0" fill="#BED0DE" stroke="#003087" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#003087">멤버 상태가 INACTIVE</text>

  <!-- Arrow: Start -> Q1 -->
  <line x1="400" y1="110" x2="400" y2="178" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,178 407,178 400,190" fill="#586F81"/>

  <!-- ===================== Q1 Diamond (보안 그룹) ===================== -->
  <polygon points="400,190 570,260 400,330 230,260" fill="#FFFFFF" stroke="#586F81" stroke-width="2"/>
  <text x="400" y="243" text-anchor="middle" font-size="14" fill="#003087">멤버가 속한 보안 그룹이</text>
  <text x="400" y="260" text-anchor="middle" font-size="14" fill="#003087">로드 밸런서의 트래픽을</text>
  <text x="400" y="277" text-anchor="middle" font-size="14" fill="#003087">허용하는가?</text>

  <!-- Branch: Q1 -> F1 (아니오) -->
  <line x1="570" y1="260" x2="638" y2="260" stroke="#586F81" stroke-width="2"/>
  <polygon points="638,253 638,267 650,260" fill="#586F81"/>
  <text x="604" y="245" text-anchor="middle" font-size="13" fill="#586F81">아니오</text>

  <rect x="650" y="215" width="220" height="90" fill="#125DE6"/>
  <text x="760" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 1</text>
  <text x="760" y="272" text-anchor="middle" font-size="13" fill="#FFFFFF">보안 그룹에 LB 트래픽</text>
  <text x="760" y="290" text-anchor="middle" font-size="13" fill="#FFFFFF">허용 규칙 없음</text>

  <!-- Arrow: Q1 -> Q1b (예) -->
  <line x1="400" y1="330" x2="400" y2="398" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,398 407,398 400,410" fill="#586F81"/>
  <text x="420" y="375" text-anchor="middle" font-size="13" fill="#586F81">예</text>

  <!-- ===================== Q1b Diamond (IP 접근 제어 그룹) ===================== -->
  <polygon points="400,410 570,480 400,550 230,480" fill="#FFFFFF" stroke="#586F81" stroke-width="2"/>
  <text x="400" y="463" text-anchor="middle" font-size="14" fill="#003087">로드 밸런서의 IP 접근 제어</text>
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#003087">그룹이 멤버 IP를</text>
  <text x="400" y="497" text-anchor="middle" font-size="14" fill="#003087">허용하는가?</text>

  <!-- Branch: Q1b -> F1b (아니오) -->
  <line x1="570" y1="480" x2="638" y2="480" stroke="#586F81" stroke-width="2"/>
  <polygon points="638,473 638,487 650,480" fill="#586F81"/>
  <text x="604" y="465" text-anchor="middle" font-size="13" fill="#586F81">아니오</text>

  <rect x="650" y="435" width="220" height="90" fill="#125DE6"/>
  <text x="760" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 2</text>
  <text x="760" y="492" text-anchor="middle" font-size="13" fill="#FFFFFF">IP 접근 제어 그룹이</text>
  <text x="760" y="510" text-anchor="middle" font-size="13" fill="#FFFFFF">멤버 IP 차단</text>

  <!-- Arrow: Q1b -> Q2 (예) -->
  <line x1="400" y1="550" x2="400" y2="618" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,618 407,618 400,630" fill="#586F81"/>
  <text x="420" y="595" text-anchor="middle" font-size="13" fill="#586F81">예</text>

  <!-- ===================== Q2 Diamond (서비스 비정상) ===================== -->
  <polygon points="400,630 570,700 400,770 230,700" fill="#FFFFFF" stroke="#586F81" stroke-width="2"/>
  <text x="400" y="683" text-anchor="middle" font-size="14" fill="#003087">멤버 인스턴스에서 서비스가</text>
  <text x="400" y="700" text-anchor="middle" font-size="14" fill="#003087">실행 중이고 포트가</text>
  <text x="400" y="717" text-anchor="middle" font-size="14" fill="#003087">열려 있는가?</text>

  <!-- Branch: Q2 -> F2 (아니오) -->
  <line x1="570" y1="700" x2="638" y2="700" stroke="#586F81" stroke-width="2"/>
  <polygon points="638,693 638,707 650,700" fill="#586F81"/>
  <text x="604" y="685" text-anchor="middle" font-size="13" fill="#586F81">아니오</text>

  <rect x="650" y="655" width="220" height="90" fill="#125DE6"/>
  <text x="760" y="692" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 3</text>
  <text x="760" y="717" text-anchor="middle" font-size="13" fill="#FFFFFF">서비스 비정상</text>

  <!-- Arrow: Q2 -> Q3 (예) -->
  <line x1="400" y1="770" x2="400" y2="838" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,838 407,838 400,850" fill="#586F81"/>
  <text x="420" y="815" text-anchor="middle" font-size="13" fill="#586F81">예</text>

  <!-- ===================== Q3 Diamond (헬스 체크 설정) ===================== -->
  <polygon points="400,850 570,920 400,990 230,920" fill="#FFFFFF" stroke="#586F81" stroke-width="2"/>
  <text x="400" y="903" text-anchor="middle" font-size="14" fill="#003087">헬스 체크 프로토콜, 포트,</text>
  <text x="400" y="920" text-anchor="middle" font-size="14" fill="#003087">URL이 실제 서비스와</text>
  <text x="400" y="937" text-anchor="middle" font-size="14" fill="#003087">일치하는가?</text>

  <!-- Branch: Q3 -> F3 (아니오) -->
  <line x1="570" y1="920" x2="638" y2="920" stroke="#586F81" stroke-width="2"/>
  <polygon points="638,913 638,927 650,920" fill="#586F81"/>
  <text x="604" y="905" text-anchor="middle" font-size="13" fill="#586F81">아니오</text>

  <rect x="650" y="875" width="220" height="90" fill="#125DE6"/>
  <text x="760" y="910" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 4</text>
  <text x="760" y="932" text-anchor="middle" font-size="13" fill="#FFFFFF">헬스 체크 설정</text>
  <text x="760" y="950" text-anchor="middle" font-size="13" fill="#FFFFFF">불일치</text>

  <!-- Arrow: Q3 -> Q4 (예) -->
  <line x1="400" y1="990" x2="400" y2="1058" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,1058 407,1058 400,1070" fill="#586F81"/>
  <text x="420" y="1035" text-anchor="middle" font-size="13" fill="#586F81">예</text>

  <!-- ===================== Q4 Diamond (타임아웃) ===================== -->
  <polygon points="400,1070 570,1140 400,1210 230,1140" fill="#FFFFFF" stroke="#586F81" stroke-width="2"/>
  <text x="400" y="1132" text-anchor="middle" font-size="14" fill="#003087">서버 응답이 타임아웃</text>
  <text x="400" y="1150" text-anchor="middle" font-size="14" fill="#003087">이내에 완료되는가?</text>

  <!-- Branch: Q4 -> F4 (아니오) -->
  <line x1="570" y1="1140" x2="638" y2="1140" stroke="#586F81" stroke-width="2"/>
  <polygon points="638,1133 638,1147 650,1140" fill="#586F81"/>
  <text x="604" y="1125" text-anchor="middle" font-size="13" fill="#586F81">아니오</text>

  <rect x="650" y="1095" width="220" height="90" fill="#125DE6"/>
  <text x="760" y="1132" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 5</text>
  <text x="760" y="1155" text-anchor="middle" font-size="13" fill="#FFFFFF">타임아웃 초과</text>

  <!-- Arrow: Q4 -> F6 (예) -->
  <line x1="400" y1="1210" x2="400" y2="1278" stroke="#586F81" stroke-width="2"/>
  <polygon points="393,1278 407,1278 400,1290" fill="#586F81"/>
  <text x="420" y="1255" text-anchor="middle" font-size="13" fill="#586F81">예</text>

  <!-- ===================== F6 Result Box (terminal) ===================== -->
  <rect x="270" y="1290" width="260" height="90" fill="#003087"/>
  <text x="400" y="1327" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">원인 6</text>
  <text x="400" y="1352" text-anchor="middle" font-size="13" fill="#FFFFFF">멤버 등록 포트 오류</text>

</svg>
